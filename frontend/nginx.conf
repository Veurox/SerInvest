# SerInvest arayüzü — derlenmiş statik site (Dockerfile "prod" aşaması)
server {
    listen 3000;
    root /usr/share/nginx/html;

    # Tek sayfalık uygulama: /model, /sembol/THYAO gibi yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html önbelleğe alınmaz — yeni derleme açılır açılmaz görünsün.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite dosya adlarına içerik özeti koyar; değişince adı da değişir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

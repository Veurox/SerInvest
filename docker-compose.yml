services:

  # ── Altyapı ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: serinvest-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-marketsentinel}
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi). Bu servis yalnızca
    # Docker'ın iç ağından, servis adıyla erişilir — host'a açılmasına gerek yok.
    # Açık bırakıldığında 0.0.0.0'a bağlanıyordu: ev ağındaki HER cihaz ve
    # ziyaret edilen web sayfaları erişebiliyordu. Hata ayıklamak için geçici
    # açmak gerekirse `ports:` satırlarını geri koy ya da `docker exec` kullan.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-marketsentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: serinvest-redis
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi). Bu servis yalnızca
    # Docker'ın iç ağından, servis adıyla erişilir — host'a açılmasına gerek yok.
    # Açık bırakıldığında 0.0.0.0'a bağlanıyordu: ev ağındaki HER cihaz ve
    # ziyaret edilen web sayfaları erişebiliyordu. Hata ayıklamak için geçici
    # açmak gerekirse `ports:` satırlarını geri koy ya da `docker exec` kullan.
    networks:
      - market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: serinvest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi). Servisler kuyruğa Docker
    # iç ağından "rabbitmq:5672" ile ulaşıyor; host'a açılmasına gerek yok.
    # Yönetim paneli (15673) de kapandı — kimlik bilgileriyle birlikte ev ağına
    # açıktı. Gerekirse geçici olarak `- "15673:15672"` geri eklenebilir.
    networks:
      - market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Analiz Servisleri ─────────────────────────────────────────────────────────
  market-data-service:
    build:
      context: ./market-data-service
    container_name: serinvest-market-data
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      # Kimlik bilgisi 04.09.2026'da eklendi: bu servisler daha önce
      # HİÇ almıyordu ve pika varsayılanı guest/guest ile bağlanıyordu.
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CHART_HTTP_PORT: 5002
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi). Bu servis yalnızca
    # Docker'ın iç ağından, servis adıyla erişilir — host'a açılmasına gerek yok.
    # Açık bırakıldığında 0.0.0.0'a bağlanıyordu: ev ağındaki HER cihaz ve
    # ziyaret edilen web sayfaları erişebiliyordu. Hata ayıklamak için geçici
    # açmak gerekirse `ports:` satırlarını geri koy ya da `docker exec` kullan.
    # (Grafik verisi arayüze core-api üzerinden gider; doğrudan çağrılmıyor.)
    volumes:
      - ./shared:/shared:ro
    networks:
      - market-network
    restart: unless-stopped

  analyst-engine:
    build:
      context: ./analyst-engine
    container_name: serinvest-analyst
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      # Kimlik bilgisi 04.09.2026'da eklendi: bu servisler daha önce
      # HİÇ almıyordu ve pika varsayılanı guest/guest ile bağlanıyordu.
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ORACLE_URL: http://serinvest-oracle:5001   # C8 anomali tetikleyici için
    networks:
      - market-network
    restart: unless-stopped

  ai-oracle-service:
    build:
      context: ./ai-oracle-service
    container_name: serinvest-oracle
    depends_on:
      rabbitmq:
        condition: service_healthy
      core-api:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      CORE_API_URL: http://core-api:8080
      ORACLE_CYCLE_MINUTES: ${ORACLE_CYCLE_MINUTES:-60}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_key_change_me}
      TZ: Europe/Istanbul
      TCMB_RATE_PCT: ${TCMB_RATE_PCT:-42.5}
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi) — EN KRİTİK OLANI.
    # Bu sunucuda kimlik doğrulaması YOK ve CORS koruması da yok. Açıkken:
    #   • ev ağındaki her cihaz yönetim uç noktalarını çağırabiliyordu,
    #   • ziyaret edilen bir web sayfası tarayıcı üzerinden POST atabiliyordu
    #     (cevabı okuyamaz ama istek sunucuda ÇALIŞIR) — /admin/reset-model
    #     düz bir POST, onay bile istemiyor: model sıfırlanabilirdi.
    # Arayüz buraya zaten core-api (8080) üzerinden, X-Admin-Key ile ulaşıyor;
    # core-api de iç ağdan "ai-oracle-service:5001" diye erişiyor.
    volumes:
      # Model + eğitim verisi PROJE KLASÖRÜNDE (bind-mount) → bilgisayar taşımada
      # klasörle birlikte gelir, named volume gibi geride kalmaz (07/2026 kararı).
      - ./oracle-data:/app/models
      - ./shared:/shared:ro            # Paylaşılan symbols.json (read-only)
    networks:
      - market-network
    restart: unless-stopped

  fundamental-service:
    build:
      context: ./fundamental-service
    container_name: serinvest-fundamental
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      # Kimlik bilgisi 04.09.2026'da eklendi: bu servisler daha önce
      # HİÇ almıyordu ve pika varsayılanı guest/guest ile bağlanıyordu.
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      FUNDAMENTAL_CYCLE_HOURS: ${FUNDAMENTAL_CYCLE_HOURS:-6}
      TCMB_RATE_PCT: ${TCMB_RATE_PCT:-42.5}
    volumes:
      - ./shared:/shared:ro
    networks:
      - market-network
    restart: unless-stopped

  tefas-service:
    build:
      context: ./tefas-service
    container_name: serinvest-tefas
    environment:
      TEFAS_HTTP_PORT: 5003
      TEFAS_DATA_DIR: /app/data
      # Birim pay değeri akşam yayımlanır; 21:00'den sonra çekilir.
      TEFAS_CEKIM_SAATI: ${TEFAS_CEKIM_SAATI:-21}
      # İlk kurulumda çekilecek geçmiş (ay). 13 ay = 1 yıllık getiri + pay.
      # Bu BİR KERELİK ve uzun sürer (~15 dk); durum diske yazılır,
      # yeniden başlatma kaldığı yerden devam eder.
      TEFAS_GERIYE_AY: ${TEFAS_GERIYE_AY:-13}
      TZ: Europe/Istanbul
    # PORT KAPALI (04.09.2026 güvenlik sertleştirmesi ile aynı gerekçe).
    # Arayüz buraya core-api (8080) üzerinden ulaşıyor.
    # RABBITMQ YOK: fon verisi kuyruğa girmiyor — gerekçe tefas-service/main.py
    # başındaki notta (günde tek satır, PriceData şeması OHLCV için, depo
    # eklemeli/noktasal-zamanlı).
    volumes:
      # Fon geçmişi PROJE KLASÖRÜNDE (oracle-data ile aynı karar): bilgisayar
      # taşımada klasörle birlikte gelir, named volume gibi geride kalmaz.
      - ./tefas-data:/app/data
      - ./shared:/shared:ro            # izlenen kategoriler buradan okunur
    networks:
      - market-network
    restart: unless-stopped

  # ── API & Frontend ────────────────────────────────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: MarketSentinel.Api/Dockerfile
    container_name: serinvest-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-marketsentinel};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-password}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_USER:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
      Admin__ApiKey: "${ADMIN_API_KEY:-dev_key_change_me}"
      Cors__AllowedOrigins: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      MarketData__ChartUrl: "http://market-data-service:5002"
      Tefas__Url: "http://tefas-service:5003"
    ports:
      - "8080:8080"
    volumes:
      - ./oracle-data:/app/oracle_models:ro   # aynı bind-mount, read-only
    networks:
      - market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: serinvest-frontend
    environment:
      # Vite dev server bu env'i `import.meta.env.VITE_ADMIN_API_KEY` olarak yayar.
      # Kişisel kullanım için: tarayıcıda manuel anahtar girmeye gerek yok.
      VITE_ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_key_change_me}
      # Windows bind mount'ta inotify çalışmaz — HMR için polling şart
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Canlı geliştirme (HMR): kod değişikliği imaj rebuild'i gerektirmez.
      # node_modules imaj içinde kalır (host'ta node yok).
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "3000:3000"
    networks:
      - market-network
    restart: unless-stopped

volumes:
  postgres_data:     # Haber/sinyal/analiz geçmişi — named volume (Windows'ta
                     # postgres bind-mount kırılgan); taşıma backup.ps1/restore.ps1 ile.
  # oracle_models kaldırıldı → artık ./oracle-data bind-mount (proje klasöründe).

networks:
  market-network:
    driver: bridge
